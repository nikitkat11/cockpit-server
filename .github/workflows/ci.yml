name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The Python side has no dependencies at all, so it runs across versions
  # cheaply. If a stdlib behaviour shifts under the parser, this is where it
  # shows up.
  tests:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Confirm there is nothing to install
        run: |
          echo "stdlib only — no requirements.txt by design"
          test ! -f requirements.txt

      - name: Byte-compile the server
        run: python -m compileall -q cockpit.py

      - name: Unit and HTTP tests
        run: python -m unittest discover tests -v

  e2e:
    name: end-to-end (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install test deps
        working-directory: e2e
        run: npm ci

      - name: Install browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # playwright.config.js starts the cockpit server itself and waits for it
      # to answer, so there is no sleep-and-hope step here.
      - name: Run E2E
        working-directory: e2e
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
